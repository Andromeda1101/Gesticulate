algorithm_registry:
  logistic_regression:
    enabled: true
    class: sklearn.linear_model.LogisticRegression
    hyperparameters:
      max_iter: 1000
      C: 1.0
  random_forest:
    enabled: true
    class: sklearn.ensemble.RandomForestClassifier
    hyperparameters:
      n_estimators: 200
      max_depth: null
      random_state: 42
  svm_rbf:
    enabled: true
    class: sklearn.svm.SVC
    hyperparameters:
      kernel: rbf
      C: 1.0
      gamma: scale
      probability: true

validation:
  strategy: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 42

export:
  format: joblib
  include_metadata_sidecar: true

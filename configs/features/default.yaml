feature_version: v1
feature_families:
  keypoints_only:
    enabled: true
    mediapipe:
      static_image_mode: true
      max_num_hands: 1
      min_detection_confidence: 0.5
      min_tracking_confidence: 0.5
    geometric:
      normalize_to_wrist: true
      include_angles: true
  hog_only:
    enabled: true
    hog:
      orientations: 9
      pixels_per_cell: [8, 8]
      cells_per_block: [2, 2]
      block_norm: L2-Hys
      transform_sqrt: true
  hybrid:
    enabled: true
    concat_order:
      - keypoints_only
      - hog_only

persistence:
  format: parquet
  inline_threshold_dim: 64

quality_flags:
  reject_low_confidence_landmarks: true
  min_visible_landmarks: 15

dataset_name: leapgestrecog
root_path: data/raw/leapgestrecog
description: LeapGestRecog static hand-gesture dataset for OOD cross-domain evaluation

# Reference vocabulary for reports; does not filter samples (see label_filter).
label_vocabulary:
  - Palm
  - L
  - Fist
  - Fist_Moved
  - Thumb
  - Index
  - OK
  - Palm_Moved
  - C
  - Down

split_strategy:
  method: fixed_eval
  train_ratio: 0.0
  val_ratio: 0.0
  test_ratio: 1.0
  seed: 42

sampling:
  max_samples_per_class: null
  shuffle: true

label_aliases:
  "01_palm": Palm
  "02_l": L
  "03_fist": Fist
  "04_fist_moved": Fist_Moved
  "05_thumb": Thumb
  "06_index": Index
  "07_ok": OK
  "08_palm_moved": Palm_Moved
  "09_c": C
  "10_down": Down

capture_context:
  source: static_images
  resolution: null

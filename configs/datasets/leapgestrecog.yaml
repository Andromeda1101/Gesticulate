dataset_name: leapgestrecog
root_path: data/raw/leapgestrecog
description: LeapGestRecog static hand-gesture dataset for OOD cross-domain evaluation

# Reference vocabulary for reports; does not filter samples (see label_filter).
label_vocabulary:
  - stop
  - palm
  - fist
  - like
  - one
  - ok
  - grip
  - thumb_index

split_strategy:
  method: fixed_eval
  train_ratio: 0.0
  val_ratio: 0.0
  test_ratio: 1.0
  seed: 42

sampling:
  max_samples_per_class: null
  shuffle: true

# LeapGestRecog folders are normalized to HaGRID-native labels at ingest time.
label_aliases:
  "01_palm": stop
  "02_l": thumb_index
  "03_fist": fist
  "04_fist_moved": fist
  "05_thumb": like
  "06_index": one
  "07_ok": ok
  "08_palm_moved": palm
  "09_c": grip
  "10_down": palm

capture_context:
  source: static_images
  resolution: null

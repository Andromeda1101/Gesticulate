dataset_name: hagrid_subset
root_path: data/raw/hagrid
description: HaGRID subset for out-of-distribution robustness evaluation

label_vocabulary:
  - Palm
  - Fist
  - Thumb_Up
  - Peace

split_strategy:
  method: fixed_eval
  train_ratio: 0.0
  val_ratio: 0.0
  test_ratio: 1.0
  seed: 42

sampling:
  max_samples_per_class: 500
  shuffle: false

capture_context:
  source: in_the_wild
  resolution: null

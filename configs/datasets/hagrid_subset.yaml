dataset_name: hagrid_subset
root_path: data/raw/hagrid/HaGRIDv2_dataset_512
description: HaGRID subset as primary in-domain dataset for training and evaluation

# Reference vocabulary for reports; does not filter samples (see label_filter).
label_vocabulary:
  - Palm
  - L
  - Fist
  - Fist_Moved
  - Thumb
  - Index
  - OK
  - Palm_Moved
  - C
  - Down

split_strategy:
  method: stratified
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

sampling:
  # Cap per-class samples so Phase 2 extraction fits in memory (~17k rows at 500/class).
  # null indexes the full HaGRID tree (~1M+ rows) and will OOM during hog/hybrid on typical WSL RAM.
  max_samples_per_class: 500
  shuffle: true

# HaGRID-native names -> canonical gesture names (additional overrides)
label_aliases:
  palm: Palm
  fist: Fist
  like: Thumb
  ok: OK
  one: Index
  rock: C
  two_up: Thumb
  two_up_inverted: Thumb
  stop: Fist_Moved

capture_context:
  source: in_the_wild
  resolution: null

experiment_id: EXP-03
name: robustness_cross_dataset
description: Train on HaGRID subset and evaluate on LeapGestRecog (OOD)

datasets:
  train: configs/datasets/hagrid_subset.yaml
  eval: configs/datasets/leapgestrecog.yaml

features:
  config: configs/features/default.yaml
  feature_family: hybrid

models:
  config: configs/models/baselines.yaml
  algorithms:
    - knn
    - svm
    - decision_tree
    - random_forest
    - naive_bayes
    - logistic_regression
    - mlp
    - cnn
    - lstm

metrics:
  primary: accuracy
  report:
    - accuracy
    - f1_macro
    - recall_macro
    - precision_macro
    - f1_micro
    - recall_micro
    - precision_micro
    - fit_seconds
    - inference_seconds
    - per_sample_inference_ms
  secondary:
    - confusion_matrix

outputs:
  models_dir: artifacts/models
  metrics_dir: artifacts/metrics/exp03_robustness
  reports_dir: reports/tables
